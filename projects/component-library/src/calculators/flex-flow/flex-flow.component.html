<header>
  <div>
    <ng-container *ngTemplateOutlet="direction"/>
    <span class="title">flex-flow</span>
    <span class="subtitle">shorthand</span>
  </div>
  <code>
    &lt;flex-direction&gt; || &lt;flex-wrap&gt;
  </code>
</header>
<div class="content">
  <div class="row result">
    <span class="label">flex-flow:</span>
    <input
      type="text"
      readonly
      [value]="result()"
      [cdkCopyToClipboard]="result()"
    />
  </div>
  <ng-container *ngTemplateOutlet="hr"/>
  <div class="row">
    <span class="label">flex-direction</span>
    <div class="options">
      <label class="option" mbrTooltip="row">
        <ng-container *ngTemplateOutlet="direction"/>
        <input type="radio" name="flex-direction" value="row" [(ngModel)]="flex_direction"/>
      </label>
      <label class="option" style="transform: rotateY(180deg)" mbrTooltip="row-reverse">
        <ng-container *ngTemplateOutlet="direction" />
        <input type="radio" name="flex-direction" value="row-reverse" [(ngModel)]="flex_direction"/>
      </label>
      <label class="option" style="transform: rotate(90deg)" mbrTooltip="column">
        <ng-container *ngTemplateOutlet="direction" />
        <input type="radio" name="flex-direction" value="column" [(ngModel)]="flex_direction"/>
      </label>
      <label class="option" style="transform: rotate(90deg) rotateY(180deg)" mbrTooltip="column-reverse">
        <ng-container *ngTemplateOutlet="direction" />
        <input type="radio" name="flex-direction" value="column-reverse" [(ngModel)]="flex_direction"/>
      </label>
    </div>
  </div>
  <ng-container *ngTemplateOutlet="hr"/>
  <div class="row">
    <span class="label">flex-wrap</span>
    <div class="options">
      <label class="option" mbrTooltip="wrap">
        <ng-container *ngTemplateOutlet="wrap" />
        <input type="radio" name="flex-wrap" value="wrap" [(ngModel)]="flex_wrap"/>
      </label>
      <label class="option" style="transform: rotateY(180deg);" mbrTooltip="wrap-reverse">
        <ng-container *ngTemplateOutlet="wrap"/>
        <input type="radio" name="flex-wrap" value="wrap-reverse" [(ngModel)]="flex_wrap"/>
      </label>
      <label class="option" mbrTooltip="nowrap">
        <svg lucideBan />
        <input type="radio" name="flex-wrap" value="nowrap" [(ngModel)]="flex_wrap"/>
      </label>
    </div>
  </div>
</div>
<footer>
  <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/flex-flow" target="_blank">documentation</a>
  <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/flex-flow" target="_blank">
    <svg lucideCircleQuestionMark />
  </a>
</footer>
