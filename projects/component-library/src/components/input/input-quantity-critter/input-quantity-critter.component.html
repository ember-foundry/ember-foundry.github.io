<button
  (click)="decrement()"
  [disabled]="disabled() || value() <= min()"
  aria-label="Decrease quantity"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 16 16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3.33337 8H12.6667" />
  </svg>
</button>
<input
  #input
  type="number"
  [value]="value()"
  [min]="min()"
  [max]="max()"
  [disabled]="disabled()"
  (input)="changed_manually($event)"
  (blur)="onTouched()"
/>
<button
  (click)="increment()"
  [disabled]="disabled() || value() >= max()"
  aria-label="Increase quantity"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 16 16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3.33337 8H12.6667" />
    <path d="M8 3.33333V12.6667" />
  </svg>
</button>
