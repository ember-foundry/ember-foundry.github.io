<svg class="outline-svg" viewBox="0 0 200 150" preserveAspectRatio="none">
  <rect class="outline-rect" x="4" y="4" width="192" height="142" rx="14"/>
</svg>

<div class="row d-flex">
  <div class="avatar" [style.background-color]="color()">
    <img src="{{ avatar() }}" alt="{{ name() }} avatar" loading="lazy">
  </div>
  <button class="d-flex" (click)="roll_dice()">
    <svg class="dice" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">

      <rect x="8" y="8" width="176" height="176" rx="24" fill="none" stroke="currentColor" stroke-linecap="round"
            stroke-linejoin="round" stroke-width="16"/>
      <g fill="currentColor">
        @switch (last_roll()) {
          @case (1) {
            <circle cx="96" cy="96" r="16"/>
          }
          @case (2) {
            <circle cx="52" cy="48" r="16"/>


            <circle cx="140" cy="144" r="16"/>
          }
          @case (3) {
            <circle cx="52" cy="48" r="16"/>

            <circle cx="96" cy="96" r="16"/>

            <circle cx="140" cy="144" r="16"/>
          }
          @case (4) {
            <circle cx="52" cy="48" r="16"/>
            <circle cx="52" cy="144" r="16"/>

            <circle cx="140" cy="48" r="16"/>
            <circle cx="140" cy="144" r="16"/>
          }
          @case (5) {
            <circle cx="52" cy="48" r="16"/>
            <circle cx="52" cy="144" r="16"/>

            <circle cx="96" cy="96" r="16"/>

            <circle cx="140" cy="48" r="16"/>
            <circle cx="140" cy="144" r="16"/>
          }
          @case (6) {
            <circle cx="52" cy="48" r="16"/>
            <circle cx="52" cy="96" r="16"/>
            <circle cx="52" cy="144" r="16"/>


            <circle cx="140" cy="48" r="16"/>
            <circle cx="140" cy="96" r="16"/>
            <circle cx="140" cy="144" r="16"/>
          }

          }
        }
      </g>
    </svg>
  </button>

</div>
