@let _svg_size = 52;
@let _stroke_width = 4;
@let _circle_center = _svg_size / 2;
@let _circle_radius = (_svg_size / 2) - (_stroke_width / 2);

<svg
  xmlns="http://www.w3.org/2000/svg"
  stroke="var(--color-status-success)"
  stroke-linecap="round"
  [attr.stroke-width]="_stroke_width"
  [attr.viewBox]="`0 0 ${_svg_size} ${_svg_size}`"
>
  <circle
    [attr.cx]="_circle_center"
    [attr.cy]="_circle_center"
    [attr.r]="_circle_radius"
    [attr.stroke-width]="_stroke_width"
    fill="none"
    stroke-dasharray="166"
    stroke-dashoffset="166"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="166"
      to="0"
      dur="0.6s"
      begin="0s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.65 0 0.45 1"
    />
  </circle>
  <path
    d="M14.1 27.2l7.1 7.2 16.7-16.8"
    fill="none"
    stroke-dasharray="48"
    stroke-dashoffset="48"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="48"
      to="0"
      dur="0.3s"
      begin="0.6s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.65 0 0.45 1"
    />
  </path>
</svg>
