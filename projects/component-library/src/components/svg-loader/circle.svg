<svg aria-hidden="true" stroke="#3b82f6" viewBox="0 0 52 52">
  <circle cx="26"
    cy="26"
    r="24"
    stroke-width="4"
    fill="none"
    stroke-dashoffset="0"
    stroke-dasharray="90 150"
    stroke-linecap="round"
  >
    <animate
      attributeName="stroke-dasharray"
      values="1,150;90,150;90,150"
      dur="1.5s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="stroke-dashoffset"
      values="0;-35;-124"
      dur="1.5s"
      repeatCount="indefinite"
    />
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 26 26"
      to="360 26 26"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>
</svg>
