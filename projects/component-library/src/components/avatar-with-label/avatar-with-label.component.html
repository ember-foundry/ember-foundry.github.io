<mbr-avatar [image_url]="image_url()" [name]="name()" [size]="size()" [bordered]="bordered()"/>
<div class="text-column">
  <span class="name">{{ name() }}</span>
  <ng-content select="[mbrAvatarLabel]">
    @if(label()){
      <span class="label" mbrAvatarLabel>{{ label() }}</span>
    }
  </ng-content>
</div>
