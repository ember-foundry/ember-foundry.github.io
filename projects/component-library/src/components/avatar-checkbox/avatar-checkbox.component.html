@let _image_url = image_url();
@let _size = size();
@if (real_selected_value()) {
  <mbr-avatar-badge [size]="_size" status="focus" mode="notch">
    <mbr-avatar name="Craig Wayne" [image_url]="_image_url" [bordered]="true" />
    <svg lucideCheck ngProjectAs="badge" color="white" />
  </mbr-avatar-badge>
} @else {
  <mbr-avatar [size]="_size" name="Craig Wayne" [image_url]="_image_url" [bordered]="true"/>
}
